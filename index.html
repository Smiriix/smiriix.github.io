<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ПониРулетка</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <div class="modalwindow">
        <div class="modalwindow__wrapper">
            <h3>Название задания</h3>
            <p>Игра: Valorant</p>
            <h2>
                Описание задания:
            </h2>
            <span></span>
            <a onclick="modal.hide();" class="modalwindow__close">Закрыть</a>
        </div>
    </div>
    <section class="poster">
        <div class="container">
            <img src="./images/logo.png" class="poster__logo" width="1589" height="716" alt="logo">
        </div>
    </section>
    <section class="rollette">
        <div class="container">
            <div class="rollette__slider">
                <div class="rollette__arrow"></div>
                <div class="rollette__wrapper">
                </div>
            </div>
            <a href="#" class="rollette__btn">
                Крутить
            </a>
        </div>
    </section>
    <div class="volume">
        <input type="checkbox" checked>
        <span> 
            <input type="range" min="0" max="1" step="0.01" value="1">
        </span>
    </div>
    <audio src="./music.mp3"></audio>
    <script src="./script.js"></script>
</body>

</html>
